<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace API — Swagger UI</title>
  <link rel="stylesheet" href="/swagger/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    header { max-width: 1460px; margin: auto; padding: 1rem 20px 0; font: 1rem/1.5 system-ui, sans-serif; color: #182234; }
    header a { color: #1349a5; }
    header code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <a href="/">На главную</a>
    <p>Выполните <code>POST /auth/login</code> через <strong>Try it out → Execute</strong>.
      Скопируйте <code>access_token</code> из ответа в <strong>Authorize</strong> без префикса <code>Bearer</code>.</p>
    <p>После авторизации запросы к защищённым ручкам отправляются с токеном. При обновлении страницы авторизация сбрасывается.</p>
  </header>
  <main id="swagger-ui"></main>
  <script src="/swagger/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/openapi.yaml",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
      deepLinking: true,
      validatorUrl: null,
      persistAuthorization: false,
      queryConfigEnabled: false
    });
  </script>
</body>
</html>
