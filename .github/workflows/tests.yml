name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOCKER_CONTEXT: default
      COMPOSE_PROJECT_NAME: soa-marketplace-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: catalog-service/go.mod
          cache-dependency-path: catalog-service/go.sum
      - name: Generate, race tests, and vet
        run: make check
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install report CLI and test run selection
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm test
      - name: Start isolated Compose stack
        id: compose
        run: make up
      - name: Go E2E
        id: e2e
        shell: bash
        run: |
          mkdir -p artifacts/e2e
          set -o pipefail
          make --silent e2e E2E_GO_FLAGS=-json | tee artifacts/e2e/go-test.jsonl
      - name: Generate Allure report, including failed runs
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        run: make e2e-report
      - name: Collect Compose diagnostics
        if: ${{ always() && steps.compose.outcome != 'skipped' }}
        run: |
          mkdir -p artifacts/e2e
          docker --context "$DOCKER_CONTEXT" compose ps -a > artifacts/e2e/compose-ps.txt
      - name: Upload E2E results, reports, and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this CI Compose project and its volume
        if: ${{ always() && steps.compose.outcome != 'skipped' }}
        run: docker --context "$DOCKER_CONTEXT" compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
